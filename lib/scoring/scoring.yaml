# Stable Future — Pathway Test scoring rubric (v2)
#
# v2 change: introduces SECTORS layer for two-stage scoring (sector → job).
# Allows graceful fallback when user is sector-sure but job-unsure.
#
# Sources: docs/research/job-market.md §7 (tier table), §3 (Anthropic
# AI-coverage), §4 (sector writeups). Rationale lives in
# docs/research/scoring-rationale.md keyed by `rationale_key`.
#
# ────────────────────────────────────────────────────────────────────────────
# Scoring algorithm (quiz consumes):
#   1. Match user's (direction, sector, job) inputs.
#   2. Both sector + job match a path → use path.scoring (R/Y/D/S);
#      exposure_score = round((3 − R) × 10/3).
#   3. Sector matches, job = "unsure" / no path → use
#      sector.sector_exposure_score + sector.sector_tier_default.
#   4. Sector = "unsure" / direction = undecided/other → use the
#      `*_undecided` sector for that direction (max-exposure default).
# ────────────────────────────────────────────────────────────────────────────
#
# Schemas:
#
# sector:
#   sector_id              snake_case unique
#   label                  parent-facing string
#   matches.direction      uni | apprenticeship | leaving_for_work | undecided | other
#   matches.keywords       list of lowercased synonyms for sector matching
#   anthropic_category     reference: the §3 Anthropic table category
#   anthropic_theoretical  reference: theoretical (Blue) coverage from §3
#   anthropic_observed     reference: observed (Red) coverage from §3
#   sector_exposure_score  0–10, hand-set, theoretical-leaning per Ben's note
#                          (long horizon → AI capability + diffusion will
#                          expand), adjusted for sector-level moats
#                          (physicality, regulation, statutory authority)
#   sector_tier_default    1 | 2 | 3 | 4 — default tier when job unspecified
#   rationale_key          key in scoring-rationale.md
#
# path:
#   path_id            snake_case unique
#   label              parent-facing string
#   sector_id          links to parent sector
#   matches.direction  uni | apprenticeship | leaving_for_work | undecided | other
#   matches.job_keywords  list of lowercased synonyms for job matching
#   soc4               list of SOC2020 4-digit codes; null if no SOC4 maps
#   scoring.{R,Y,D,S}  0–3 per §1 framework axes
#   total              R+Y+D+S, 0–12
#   tier               1 (≥11) | 2 (9–10) | 3 (6–8) | 4 (≤5)
#   exposure_score     0–10 AI-displacement risk; = round((3 − R) × 10/3)
#   rationale_key      key in scoring-rationale.md
# ────────────────────────────────────────────────────────────────────────────

version: 2
last_updated: 2026-06-05

